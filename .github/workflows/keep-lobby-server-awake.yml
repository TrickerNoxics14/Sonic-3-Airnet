# Keeps the free lobby server awake. It runs on Render's free plan, which puts a service to sleep after 15 minutes without requests; the first player after
# that waited about a minute while it woke up. A request every 10 minutes keeps it running. (The free plan has 750 hours a month: one service running the
# whole month, 744 hours at most, fits.)
# GitHub runs scheduled workflows only from the default branch, may start them some minutes late, and pauses them after 60 days without any activity in the
# repository (re-enable it under Actions).
name: Keep the lobby server awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ask the lobby server whether it is up
        run: curl --silent --show-error --fail --max-time 90 --retry 2 --retry-delay 10 https://sonic3-airnet-relay.onrender.com/health
